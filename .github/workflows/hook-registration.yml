name: Hook registration check

# Static checks of the reversible-hook registration rules (docs/HookRegistration.md) on the files a PR changes:
# InjectHooks() called from InjectHooksMain, no plugin::Call to its own address while installed as reversed,
# no duplicate addresses, VMT installs need RH_ScopedVirtualClass, private InjectHooks needs the friend, ...
# Pure Python, no build and no game executable needed (the vtable check is skipped without gta_sa.exe).

on:
  pull_request:
    paths:
      - 'source/**'
      - '.claude/skills/review-reversal/scripts/check_hooks.py'
      - '.github/workflows/hook-registration.yml'

jobs:
  check-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check hook registration of changed files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          python .claude/skills/review-reversal/scripts/check_hooks.py --base "origin/${{ github.base_ref }}"
